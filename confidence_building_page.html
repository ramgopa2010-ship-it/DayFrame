<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900&display=swap"
    rel="stylesheet">
  <title>CONFIDENCE</title>
  <style>
    :root {
      --sage: #CCD5AE;
      --mint: #E9EDC9;
      --cream: #FEFAE0;
      --beige: #FAEDCD;
      --tan: #DDB892;
      --dark: #6b5d4f;
      --shadow: 0 10px 30px rgba(107, 93, 79, 0.15);
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, var(--cream) 0%, var(--beige) 50%, var(--sage) 100%);
      color: var(--dark);
      min-height: 100vh;
      padding: 40px 20px;
      position: relative;
      overflow-x: hidden;
      opacity: 0;
      animation: fadeIn 0.8s ease forwards;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }

    /* Floating Background Shapes */
    body::before,
    body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      opacity: 0.15;
      pointer-events: none;
      z-index: 0;
    }

    body::before {
      width: 400px;
      height: 400px;
      background: var(--sage);
      top: -100px;
      right: -100px;
      animation: float1 20s ease-in-out infinite;
    }

    body::after {
      width: 300px;
      height: 300px;
      background: var(--tan);
      bottom: -80px;
      left: -80px;
      animation: float2 25s ease-in-out infinite;
    }

    @keyframes float1 {

      0%,
      100% {
        transform: translate(0, 0) rotate(0deg);
      }

      50% {
        transform: translate(-50px, 50px) rotate(180deg);
      }
    }

    @keyframes float2 {

      0%,
      100% {
        transform: translate(0, 0) rotate(0deg);
      }

      50% {
        transform: translate(50px, -50px) rotate(-180deg);
      }
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 60px;
      position: relative;
      z-index: 1;
    }

    .header .support {
      font-size: 32px;
      font-weight: 600;
      color: var(--tan);
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    .header .mental {
      font-size: 90px;
      font-weight: 900;
      background: linear-gradient(135deg, var(--sage), var(--tan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -2px;
      text-shadow: 0 4px 20px rgba(204, 213, 174, 0.3);
    }

    @media (max-width: 600px) {
      .header .mental {
        font-size: 50px;
      }

      .header .support {
        font-size: 24px;
      }
    }

    /* Cards Container */
    .cards-grid {
      max-width: 1400px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 28px;
      position: relative;
      z-index: 1;
    }

    @media (max-width: 400px) {
      .cards-grid {
        grid-template-columns: 1fr;
      }
    }

    /* Card Styling */
    .confidence-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      border-radius: var(--radius);
      padding: 32px;
      box-shadow: var(--shadow);
      border: 2px solid rgba(204, 213, 174, 0.3);
      position: relative;
      overflow: hidden;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .confidence-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, var(--sage), var(--tan));
    }

    .confidence-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 40px rgba(107, 93, 79, 0.2);
      border-color: var(--sage);
    }

    .confidence-card h3 {
      font-size: 26px;
      font-weight: 700;
      color: var(--dark);
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .confidence-card h3::before {
      content: '';
      width: 8px;
      height: 8px;
      background: var(--tan);
      border-radius: 50%;
      box-shadow: 0 0 0 4px rgba(221, 184, 146, 0.3);
    }

    /* Form Elements */
    input[type="text"],
    input[type="range"],
    textarea {
      width: 100%;
      padding: 16px;
      border: 2px solid var(--mint);
      border-radius: 12px;
      font-family: 'Poppins', sans-serif;
      font-size: 15px;
      background: var(--cream);
      color: var(--dark);
      transition: all 0.3s;
      margin-bottom: 12px;
    }

    input[type="text"]:focus,
    textarea:focus {
      outline: none;
      border-color: var(--sage);
      box-shadow: 0 0 0 4px rgba(204, 213, 174, 0.2);
      background: white;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    /* Buttons */
    button {
      width: 100%;
      padding: 16px 24px;
      background: linear-gradient(135deg, var(--sage), var(--mint));
      color: var(--dark);
      border: none;
      border-radius: 12px;
      font-family: 'Poppins', sans-serif;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 12px rgba(204, 213, 174, 0.3);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(204, 213, 174, 0.4);
      background: linear-gradient(135deg, var(--mint), var(--sage));
    }

    button:active {
      transform: translateY(0);
    }

    /* Win List */
    #winList {
      list-style: none;
      margin-top: 20px;
    }

    #winList li {
      padding: 14px 18px;
      background: linear-gradient(135deg, var(--cream), var(--beige));
      border-left: 4px solid var(--tan);
      border-radius: 10px;
      margin-bottom: 10px;
      font-size: 15px;
      animation: slideIn 0.4s ease;
      box-shadow: 0 2px 8px rgba(221, 184, 146, 0.2);
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(-20px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    /* Checkboxes */
    label {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: var(--cream);
      border-radius: 10px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: all 0.3s;
      border: 2px solid transparent;
    }

    label:hover {
      background: var(--beige);
      border-color: var(--sage);
    }

    input[type="checkbox"] {
      width: 24px;
      height: 24px;
      cursor: pointer;
      accent-color: var(--tan);
    }

    /* Effort Score */
    #effortScore {
      margin-top: 20px;
      padding: 16px;
      background: linear-gradient(135deg, var(--sage), var(--mint));
      border-radius: 12px;
      text-align: center;
      font-size: 20px;
      font-weight: 700;
      color: var(--dark);
      box-shadow: 0 4px 12px rgba(204, 213, 174, 0.3);
    }

    /* Range Slider */
    input[type="range"] {
      height: 12px;
      border-radius: 999px;
      background: linear-gradient(to right, var(--beige), var(--tan));
      outline: none;
      -webkit-appearance: none;
      margin: 20px 0;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: white;
      border: 4px solid var(--tan);
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(221, 184, 146, 0.4);
      transition: all 0.3s;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    input[type="range"]::-moz-range-thumb {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: white;
      border: 4px solid var(--tan);
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(221, 184, 146, 0.4);
    }

    #confidenceValue {
      text-align: center;
      font-size: 36px;
      font-weight: 900;
      color: var(--tan);
      margin-top: 20px;
      text-shadow: 0 2px 8px rgba(221, 184, 146, 0.3);
    }

    /* Form Styling */
    #winForm {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    #winForm input {
      flex: 1;
      margin-bottom: 0;
    }

    #winForm button {
      width: auto;
      padding: 16px 32px;
    }
  </style>
</head>

<body>

  <div class="header">
    <p class="support">Bring back your</p>
    <p class="mental">Confidence</p>
  </div>

  <div class="cards-grid">

    <!-- Micro-Wins Tracker -->
    <div class="confidence-card">
      <h3>Micro-Wins Tracker</h3>
      <form id="winForm">
        <input type="text" id="winInput" placeholder="What small win did you achieve today?" required>
        <button type="submit">Add</button>
      </form>
      <ul id="winList"></ul>
    </div>

    <!-- Reframe a Setback -->
    <div class="confidence-card">
      <h3>Reframe a Setback</h3>
      <textarea id="failInput" placeholder="What happened?"></textarea>
      <textarea id="learnInput" placeholder="What did you learn?"></textarea>
      <textarea id="nextInput" placeholder="What will you try next?"></textarea>
      <button onclick="saveReframe()">Save Reflection</button>
    </div>

    <!-- Your Strengths -->
    <div class="confidence-card">
      <h3>Your Strengths</h3>
      <input id="strength1" type="text" placeholder="Strength 1">
      <input id="strength2" type="text" placeholder="Strength 2">
      <input id="strength3" type="text" placeholder="Strength 3">
      <button onclick="saveStrengths()">Save Strengths</button>
    </div>

    <!-- Effort Tracker -->
    <div class="confidence-card">
      <h3>Effort Tracker</h3>
      <label><input type="checkbox" class="effort"> Studied 30 minutes</label>
      <label><input type="checkbox" class="effort"> Practiced skills</label>
      <label><input type="checkbox" class="effort"> Asked a question</label>
      <div id="effortScore">0 / 3 completed</div>
    </div>

    <!-- Confidence Check -->
    <div class="confidence-card">
      <h3>Confidence Check</h3>
      <input type="range" id="confidenceRange" min="1" max="10" value="5">
      <div id="confidenceValue">5 / 10</div>
    </div>

  </div>

  <script>
    // Micro-Wins Tracker
    const winForm = document.getElementById("winForm");
    const winInput = document.getElementById("winInput");
    const winList = document.getElementById("winList");
    const WIN_KEY = "confidence_wins";

    function loadWins() {
      return JSON.parse(localStorage.getItem(WIN_KEY) || "[]");
    }

    function saveWins(wins) {
      localStorage.setItem(WIN_KEY, JSON.stringify(wins));
    }

    function renderWins(wins) {
      winList.innerHTML = "";
      wins.forEach(win => {
        const li = document.createElement("li");
        li.textContent = "✔ " + win;
        winList.appendChild(li);
      });
    }

    let wins = loadWins();
    renderWins(wins);

    winForm.addEventListener("submit", e => {
      e.preventDefault();
      const text = winInput.value.trim();
      if (!text) return;
      wins.unshift(text);
      saveWins(wins);
      renderWins(wins);
      winInput.value = "";
    });

    // Reframe a Setback
    function saveReframe() {
      const data = {
        fail: document.getElementById("failInput").value,
        learn: document.getElementById("learnInput").value,
        next: document.getElementById("nextInput").value
      };
      localStorage.setItem("confidence_reframe", JSON.stringify(data));
      alert("Reflection saved!");
    }

    // Your Strengths
    function saveStrengths() {
      const strengths = [
        document.getElementById("strength1").value,
        document.getElementById("strength2").value,
        document.getElementById("strength3").value
      ];
      localStorage.setItem("confidence_strengths", JSON.stringify(strengths));
      alert("Strengths saved!");
    }

    // Effort Tracker
    const efforts = document.querySelectorAll(".effort");
    const effortScore = document.getElementById("effortScore");

    function updateEffort() {
      let count = 0;
      efforts.forEach(e => { if (e.checked) count++; });
      effortScore.textContent = count + " / " + efforts.length + " completed";
    }

    efforts.forEach(e => e.addEventListener("change", updateEffort));
    updateEffort();

    // Confidence Check
    const range = document.getElementById("confidenceRange");
    const value = document.getElementById("confidenceValue");

    range.addEventListener("input", () => {
      value.textContent = range.value + " / 10";
    });
  </script>

</body>

</html>
